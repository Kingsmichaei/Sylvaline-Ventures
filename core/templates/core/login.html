<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Sign In — Complete SYLVALINE Ventures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --accent: #00e5a0;
      --accent-3: #f43f5e;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }
    [data-theme="dark"] {
      --bg: #090c14;
      --surface: rgba(255,255,255,0.05);
      --surface-2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --border-focus: rgba(0,229,160,0.5);
      --text: #f0f4ff;
      --text-2: rgba(240,244,255,0.65);
      --text-3: rgba(240,244,255,0.35);
      --glass: rgba(13,18,32,0.8);
    }
    [data-theme="light"] {
      --bg: #f0f4f8;
      --surface: rgba(255,255,255,0.7);
      --surface-2: rgba(255,255,255,0.9);
      --border: rgba(0,0,0,0.08);
      --border-focus: rgba(0,229,160,0.6);
      --text: #0d1b2a;
      --text-2: rgba(13,27,42,0.65);
      --text-3: rgba(13,27,42,0.35);
      --glass: rgba(240,244,248,0.85);
    }

    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { height:100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(0,229,160,0.1) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(59,130,246,0.08) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(139,92,246,0.04) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width:400px;height:400px; top:-100px;left:-100px; background:rgba(0,229,160,0.06); animation-delay:0s; }
    .orb-2 { width:300px;height:300px; bottom:-50px;right:-50px; background:rgba(59,130,246,0.06); animation-delay:3s; }
    .orb-3 { width:200px;height:200px; top:50%;right:10%; background:rgba(245,158,11,0.05); animation-delay:5s; }

    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50%      { transform: translateY(-20px) scale(1.05); }
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--glass);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }

    .brand-mark {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), #00b37a);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-weight: 800; font-size: 22px;
      color: #001a0f;
      box-shadow: 0 8px 24px rgba(0,229,160,0.35);
      margin-bottom: 20px;
    }

    .login-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 26px;
      color: var(--text);
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 14px;
      color: var(--text-2);
      margin-bottom: 32px;
    }

    .form-group { margin-bottom: 18px; }

    label.field-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 7px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap .input-icon {
      position: absolute;
      left: 13px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-3);
      font-size: 15px;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 12px 14px 12px 40px;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-wrap input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0,229,160,0.12);
      background: var(--surface-2);
    }

    .input-wrap input::placeholder { color: var(--text-3); }

    .toggle-pw {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-3);
      cursor: pointer; font-size: 15px;
      transition: color 0.2s;
    }

    .toggle-pw:hover { color: var(--text-2); }

    .error-msg {
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #f43f5e;
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 18px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), #00c485);
      border: none;
      border-radius: 14px;
      color: #001a0f;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0,229,160,0.3);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,229,160,0.4);
    }

    .btn-login:active { transform: translateY(0); }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-3);
      margin-top: 24px;
    }

    /* Theme toggle */
    .theme-pill {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 100;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 12px;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-2);
      font-family: var(--font-body);
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- Theme toggle -->
  <button class="theme-pill" id="themeToggle">
    <i class="bi bi-moon-fill" id="themeIcon"></i>
    <span id="themeLabel">Dark</span>
  </button>

  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark">SV</div>
      <div class="login-title">Welcome back</div>
      <div class="login-sub">Sign in to Complete SYLVALINE Ventures</div>

      {% if form.errors %}
      <div class="error-msg">
        <i class="bi bi-exclamation-circle-fill"></i>
        Incorrect username or password. Please try again.
      </div>
      {% endif %}

      {% if messages %}
      {% for msg in messages %}
      <div class="error-msg" style="{% if 'success' in msg.tags %}background:rgba(0,229,160,0.1);border-color:rgba(0,229,160,0.25);color:var(--accent);{% endif %}">
        <i class="bi bi-info-circle-fill"></i> {{ msg }}
      </div>
      {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label class="field-label" for="id_username">Username</label>
          <div class="input-wrap">
            <i class="bi bi-person-fill input-icon"></i>
            <input type="text" name="username" id="id_username" placeholder="Enter your username" autocomplete="username" required>
          </div>
        </div>
        <div class="form-group">
          <label class="field-label" for="id_password">Password</label>
          <div class="input-wrap">
            <i class="bi bi-lock-fill input-icon"></i>
            <input type="password" name="password" id="id_password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-pw" onclick="togglePassword()">
              <i class="bi bi-eye-fill" id="eyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
      </form>

      <div class="footer-note">
        Complete SYLVALINE Ventures · Business Suite
      </div>
    </div>
  </div>

  <script>
    // Theme
    const html = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');

    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      localStorage.setItem('sv-theme', t);
      icon.className = t === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
      label.textContent = t === 'dark' ? 'Dark' : 'Light';
    }

    applyTheme(localStorage.getItem('sv-theme') || 'dark');
    toggle.addEventListener('click', () => {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // Password toggle
    function togglePassword() {
      const pw = document.getElementById('id_password');
      const eye = document.getElementById('eyeIcon');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      eye.className = pw.type === 'password' ? 'bi bi-eye-fill' : 'bi bi-eye-slash-fill';
    }
  </script>
</body>
</html>
